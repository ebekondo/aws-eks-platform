apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-eks-backend
  labels:
    app: aws-eks-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aws-eks-backend

  template:
    metadata:
      labels:
        app: aws-eks-backend

    spec:
      containers:
        - name: aws-eks-backend
          image: 678494330006.dkr.ecr.us-east-1.amazonaws.com/aws-eks-backend:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: APP_ENV
              value: "dev"
            - name: APP_VERSION
              value: "1.1"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
